  # ── 메타 (m) ──
  - id: meta.hierarchy
    topic: meta
    when: 특정 지역·분류의 하위 값(예 울산의 구·군)이 필요할 때
    do: kosis m <ORG> <TBL> --under <상위 코드> 로 바로 아래 코드를 받는다 (끝에 d 에 넣을 "a+b+c" 가 나옴). 상위 코드를 모르면 --find <이름>, 대분류만이면 --level 1
    why: 메타에 상위-하위 관계(UP_ITM_ID)가 들어 있다. 이름만으로는 같은 '중구'가 여러 시에 있다
    evidence: "m 101 DT_1FS1101 --under 26 → 26010 중구·26020 남구·26030 동구·26040 북구·26510 울주군, --class1 \"26010+26020+26030+26040+26510\""
