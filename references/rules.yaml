    when: 접두 코드("41*")를 쓸 때
    do: 상위 값 자신과 모든 하위 단계가 섞여 나온다는 것을 감안한다. 한 단계만 원하면 하위 코드를 + 로 나열한다
    why: 접두 일치라 경기도(41)·시(41110…)·구가 모두 포함된다
    evidence: "d 101 DT_1YL20651E --class1 '41*' → 경기도 + 시·구 32행"
    verified: "2026-10-12"

  - id: data.all-mixes-levels
    topic: data
    when: ALL 을 쓸 때
    do: "모든 단계(대·중·소분류)가 다 나온다는 것을 감안한다. 대분류만 원하면 최상위 코드를 + 로 나열한다. 최상위가 기준 이름(성별·연령별…)인 묶음 축이면 ALL 을 쓰지 않는다 (meta.mixed-axis)"
    why: ALL 은 축의 모든 값
    evidence: "101/INH_DT_1K52F01_26 산업 ALL → 1,620개 업종, 1,851행"
    verified: "2026-10-12"

  - id: data.auto-split
    topic: data
    when: 큰 조회
    do: 4만 셀을 넘으면 kosis 가 시점·분류로 자동 분할한다. 너무 느리면 분류·항목을 좁힌다
    why: KOSIS 한 번 조회 한도 4만 셀 ([31])
    evidence: "DT_1B04006 단일 연도 ~134만 셀 → 분류 2차 분할로 89,353행 (LEARNINGS.md)"
    verified: "2026-06-15"

  # ── 시점 ──
  - id: period.quarter-format
    topic: period
    when: 분기(Q) 기간을 지정할 때
    do: "분기 YYYYQQ (2025년 1분기 = 202501), 반기 YYYYHH (상반기 202401·하반기 202402). 반기 코드는 S(공식)·H 둘 다 되고 결과 PRD_SE 는 S. kosis 는 5자리(20251)를 넣어도 6자리로 바꿔 보낸다(자동 분할 포함)"
    why: "KOSIS 는 6자리만 받는다 — 5자리(20251)는 [30] 데이터 없음. v0.5.22 까지 문서(SKILL·03·d 도움말)가 20241 로 잘못 적었고, 자동 분할도 5자리로 보내 큰 분기·반기 조회가 [30] 이 될 수 있었다"
    evidence: "d 101 DT_1DA7104S -p Q -s 202501 -e 202502 성공 / d 101 INH_1J22003 -p Q -s 20251 → [30]. 2026-10-12 API 직접: 301/DT_200Y108 Q 202401 성공·20241 [30], 101/DT_1ES3A02S prdSe=S·H 모두 성공(결과 S), 202401 성공·20241 [30]"
    verified: "2026-10-12"

  - id: period.month-year-format
    topic: period
    when: 월·연 기간을 지정할 때
    do: "월 YYYYMM (202601), 연 YYYY"
    why: 출력 시점 표기와 같다
    evidence: "101/DT_1YL20162E 월 202601, 연 표들 2024"
    verified: "2026-10-12"

  - id: period.latest-unit
    topic: period
    when: --latest N 을 쓸 때
    do: N 은 표 주기 단위의 개수다 (월간 표에서 최근 1년 = --latest 12)
    why: 연 단위로 세지 않는다
    evidence: "101/DT_1YL20162E --latest 6 → 6개월"
    verified: "2026-10-10"

  - id: period.range-clips
    topic: period
    when: 끝 시점을 넉넉히 잡을 때
    do: 수록 범위를 넘는 끝 시점을 줘도 있는 데까지 나온다
    why: 최신 연도를 몰라도 범위 조회가 된다
    evidence: "101/INH_1B83A35 -s 2020 -e 2026 → 2020~2025"
    verified: "2026-10-10"

  - id: period.code-labels
    topic: period
    when: 수록주기를 읽고 넘길 때
    do: "메타는 주기를 한글(년·월·분기)로 보여주고, d 에는 -p Y·M·Q 로 넘기며, d 결과의 PRD_SE 는 A(연)·M·Q 로 나온다 — 같은 것이다"
    why: 표기가 세 가지라 다른 주기로 오해하기 쉽다
    evidence: "m 101 DT_1FS1104 PERIODS PRD_SE '년' / d 101 DT_1FS1101 -p Y … 결과 PRD_SE 'A'"
    verified: "2026-10-12"

  - id: period.latest-per-table
    topic: period
    when: 최신 자료를 말할 때
    do: "최신 시점은 표마다 다르다. '표 A 는 2024, 표 B 는 2024 까지' 처럼 표별로 말하고, 여러 표에 공통인 연도는 실제로 확인한 표들에 대해서만 말한다"
    why: 한두 표의 최신 연도를 관련 통계 전체의 최신처럼 말하면 과장이다
    evidence: "2026-10-12 실사용 감사 D7·G2 — 두 표의 공통 최신 2024 를 '모든 관련 통계 최신' 처럼 표현"
    verified: "2026-10-12"

  - id: period.item-latest-differs
    topic: period
    when: 여러 항목을 한 번에 최신 시점(-l 1 등)으로 조회할 때
    do: "표의 수록 기간(m --type PRD)은 표 전체 기준이다. 항목마다 마지막 시점이 다를 수 있으니 요청한 항목이 결과에 모두 있는지 확인한다 (kosis d 는 빠진 항목을 stderr 에 경고). 빠진 항목은 -s <표 시작> -e <표 끝> 으로 그 항목만 조회해 실제 마지막 시점을 찾고, 답에 항목별 시점을 따로 적는다. -l 1 은 표의 최근 시점이라 그 항목이 끝난 표에선 [30]"
    why: "최신 연도 조회에서 한 항목만 조용히 빠져, 그 항목이 없는 것으로 오해하거나 다른 지표로 대신 답하기 쉽다"
    evidence: "2026-10-12 207/DT_2071F01(울산 연보, 수록 1994~2024): -l 1 로 종사자수+생산액 → 종사자수 2024 6행만, 생산액 없음. 생산액만 -s 2008 -e 2024 → 2008~2013 만 있음. 생산액만 -l 1 → [30]"
    verified: "2026-10-12"

  - id: period.empty-may-be-unpublished
    topic: period
    when: 특정 값이 [30] 데이터 없음일 때
    do: 바로 이전 시점으로 다시 조회해 본다. 최신 시점만 아직 공표 전일 수 있다
    why: 값 자체가 없는 것과 최신 시점이 비어 있는 것은 다르다
    evidence: "142/DT_BR_B008 class3 16142T209(전체기업): 2023 → [30], 2022 → 3,159명"
    verified: "2026-10-12"

  # ── 오류 코드 ──
  - id: output.stdout-data-only
    topic: workflow
    when: -f json/csv 결과를 프로그램(Python·jq)으로 읽을 때
    do: "stdout 만 읽는다. 결과 수·안내·경고·오류는 stderr 로 나온다 (2>/dev/null 로 버려도 된다). 결과가 없으면 json 은 []. 인자·형식 오류나 조회 실패는 종료 코드 1 이니 종료 코드를 먼저 본다 (s·m·d·ex·ls·rules list)"
    why: "v0.5.16 부터 안내문을 stdout 에서 뺐다. 이전 버전은 '검색 결과: N개' 가 JSON 뒤에 붙어 파싱이 깨졌다"
    evidence: "kosis s 울산 -n 2 -f json 2>/dev/null | python3 -c 'import json,sys; json.load(sys.stdin)' 성공. 2026-10-12 v0.5.22 까지 s -n -1 은 panic(exit 2), s -f nonsense·m 101·d 조회 실패·깨진 rules 의 rules list 는 exit 0 (rules list 는 오류를 stdout 에) → 모두 stderr·exit 1 로 정정"
    verified: "2026-10-12"

  - id: output.shapes
    topic: workflow
    when: -f json 결과를 프로그램으로 읽을 때
    do: "명령마다 모양이 다르다 — s·d·ind·ls: 행 배열 / m(요약): 객체 1개를 담은 배열(CLASSIFICATIONS·ITEMS·PERIODS) / m --find·--under·--level: 코드 행 배열(flag·code·name·level·path) / m --type: API 필드 그대로의 배열 / ex: 객체(links·notes·explain). 결과가 없으면 배열은 []"
    why: 명령별로 구조가 달라 같은 방식으로 읽으면 깨진다
    evidence: "v0.5.17 에서 s·m·m --under·m --type CMMT·ex·d·ind·ls 의 -f json 을 json.load 로 모두 파싱 (2026-10-12)"
    verified: "2026-10-12"

  - id: answer.table-first
    topic: answer
    when: 사용자에게 조회 결과를 답할 때
    do: "결과 표를 먼저 보여준다(-f md 또는 --pivot 비교표). 설명·주의는 표 뒤에. 행을 열로 펼치는 등 원표를 재배치했으면 그렇게 했다고 적고, 원자료(코드·원 단위 값)는 파일이나 별도 표로 남긴다"
    why: 사용자는 표를 먼저 본다. 재배치 사실을 밝히지 않으면 원표로 오해한다
    evidence: "2026-10-12 실사용 감사 G10·E13 — 표를 먼저 보여주지 않아 사용자가 재요청"
    verified: "2026-10-12"

  - id: answer.requested-measure
    topic: answer
    when: 요청한 지표(예 생산액)가 고른 표에 없을 때
    do: "다른 지표(예 출하액)로 바꿔 답하지 않는다. '이 표에는 요청한 지표가 없다' 고 먼저 말하고, 대안을 따로 제시한다 — (1) 이름이 다른 비슷한 지표는 다른 지표임을 밝혀서, (2) 같은 지표가 있는 다른 수준(예 시도 단위)의 표. 사용자가 고르게 한다"
    why: 비슷한 이름의 다른 지표를 대용으로 쓰면 요청과 다른 답이 된다
    evidence: "m 101 DT_1FS1101 --find 생산액 → 없음, 출하액은 T04. 101/DT_1FS1104 에는 생산액(T07)과 출하액 계(T02)가 함께 있고 값이 다르다 — 울산 2024 278,929,223 vs 278,421,843 백만원 (2026-10-12)"
    verified: "2026-10-12"

  - id: answer.scope-notes
    topic: answer
    when: 표의 값을 답할 때
    do: "표마다 조사명, 조사 범위(예 10명 이상 사업체), 제외 대상(예 특정 산업 제외), 시점, 단위를 함께 적는다. 근거는 kosis ex 와 m --type CMMT. '전체'·'합계'는 그 조사 범위 안의 합계라고 쓴다"
    why: "'전체' 를 지역 전 산업·전 사업체로 오해하기 쉽다"
    evidence: "ex 101 DT_1FS1101·DT_1FS1104 → 광업·제조업 10인 이상 사업체. ex 118 DT_118N_SAUPM75 → 자영업자(+무급가족종사자)로만 된 사업체·공무원 재직기관·O 공공행정 산업 제외, 2020년 기준 자료부터 일정한 물리적 장소가 없는 사업체 제외 — 이 표의 '전체'는 도시 전체 모든 고용이 아니다 (2026-10-12)"
    verified: "2026-10-12"

  - id: answer.suppressed-missing
    topic: answer
    when: 결과에 X(비공개)가 있거나 어떤 조합의 행이 아예 없을 때
    do: "X 는 X 로 두고 추정·역산하지 않는다. parquet 으로 저장했으면 DT(숫자)가 아니라 DT_RAW(원문)로 X 를 확인한다. 행이 없는 조합은 0 이나 X 로 바꾸지 말고 '-'(행 없음)로 표시하고 그 뜻을 적는다. 공개 값만으로 합계를 다시 만들 수 없다고 밝힌다"
    why: 비공개를 채우거나 없는 행을 0 으로 쓰면 틀린 통계가 된다
    evidence: "d 101 DT_1FS1101 울산 구군 × 광업(B) 출하액 — 남구·울주군 X, 중구·동구·북구는 행 없음 (2026-10-12 --pivot C1 결과 빈 칸)"
    verified: "2026-10-12"

  - id: answer.no-double-count
    topic: answer
    when: 합계와 하위 분류(대분류·중분류)가 함께 든 결과를 더하거나 비율을 낼 때
    do: "같은 단계의 값끼리만 더한다. m 의 level·path 로 단계를 확인하고, 합계 행은 합산에서 뺀다"
    why: 합계와 하위 값을 함께 더하면 두 번 센다
    evidence: "101/DT_1FS1101 산업축에 0(광업 및 제조업)·B·C 와 중분류가 함께 있다 (m --level)"
    verified: "2026-10-12"

  - id: answer.level-choice
    topic: answer
    when: "'업종별'·'지역별'처럼 분류 수준이 정해지지 않은 요청에 답할 때"
    do: "고른 수준(예 산업 대분류)을 답에 밝히고, 다른 수준(중분류 등)도 가능하다고 알린다. 표마다 다른 수준을 골랐으면 그 이유를 적는다"
    why: 수준을 말없이 고르면 사용자가 원한 범위와 다를 수 있다
    evidence: "2026-10-12 실사용 감사 E5 — 종사자는 대분류, 광제조는 중분류를 설명 없이 선택"
    verified: "2026-10-12"

  - id: answer.units
    topic: answer
    when: 큰 금액·값을 보여줄 때
    do: "원 단위 값(예 백만원)을 그대로 두고, 읽기 쉽게 바꿀 때는(예 조원) 바꿨다는 사실과 단위를 적는다"
    why: 단위 변환을 밝히지 않으면 값이 틀려 보이거나 틀리게 읽힌다
    evidence: "101/DT_1FS1101 출하액 단위 백만원 — 울산 남구 제조업 93,569,395 (2024)"
    verified: "2026-10-12"

  - id: answer.deliver-promised-files
    topic: answer
    when: 결과를 파일로 정리하겠다고 말했을 때
    do: "실제로 파일을 만들고(d -o 결과.xlsx/.csv 또는 정리한 표) 경로를 알린다. 만들지 못했으면 그렇다고 말한다"
    why: 말한 산출물이 없으면 사용자가 다시 요청해야 한다
    evidence: "2026-10-12 실사용 감사 G9 — 파일로 정리한다고 했지만 만들지 않음"
    verified: "2026-10-12"

  - id: error.20
    topic: error
    when: "[20] 필수 변수 누락"
    do: m 으로 분류축 개수를 확인하고 --class1~N 을 모두 채운다
    evidence: LEARNINGS.md 오류코드 대응
    verified: "2026-06-15"
  - id: error.21
    topic: error
    when: "[21] 잘못된 요청 변수"
    do: m 으로 분류·항목 코드를 다시 확인한다 (한글 이름을 넘기지 않았는지)
    evidence: LEARNINGS.md 오류코드 대응
    verified: "2026-06-15"
  - id: error.30
    topic: error
    when: "[30] 데이터 없음"
    do: 시점 형식(period.*)과 최신 시점 공표 여부(period.empty-may-be-unpublished)를 확인한다. 검색이 [30] 이면 검색어를 줄인다(search.terms-not-sentences)
    evidence: LEARNINGS.md 오류코드 대응 + 2026-10-12 실측
    verified: "2026-10-12"
  - id: error.31
    topic: error
    when: "[31] 4만 셀 초과"
    do: 자동 분할로도 안 되면 분류·항목 범위를 좁힌다
    evidence: LEARNINGS.md 오류코드 대응
    verified: "2026-06-15"
  - id: error.429
    topic: error
    when: HTTP 429 분당 호출 제한
    do: kosis 가 자동으로 재시도한다. 잦으면 kosis config add-key 로 키를 늘린다
    evidence: LEARNINGS.md 오류코드 대응
    verified: "2026-06-15"

