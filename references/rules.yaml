    do: "년→Y, 월→M, 분기→Q, 반기→H, 2년·3년·4년·5년 등 여러 해 주기→모두 F. F 를 '5년'이라고 설명하지 않는다 (v0.5.21 부터 -p \"3년\" 처럼 메타 이름 그대로 넣어도 F 로 바뀐다)"
    why: "메타는 한글로 주고 data 는 코드를 받는다. KOSIS 의 F 는 '5년'이 아니라 2년 이상 다년 주기 전체다. 여러 해 주기 표에 Y·IR 을 쓰면 [30]. 예전 이 규칙은 '5년→F'만 적어 3년 표를 못 받는 것을 '데이터 없음'으로 잘못 봤다"
    evidence: "m 101 DT_1YL20162E 주기 '월'. 2026-10-12 실측: 117/DT_117071_004(3년)·202/DT_BS2020_3_157(2년)·380/DT_380002_A001A(4년)·154/DT_154001_006(5년) 모두 -p F 만 성공, -p Y·IR 은 [30]. v0.5.20 까지 -p \"3년\" 은 [30]"
    verified: "2026-10-12"

  - id: meta.extra-categories
    topic: meta
    when: 성별 등 단순해 보이는 축을 전체로 펼칠 때
    do: 축 값 목록을 확인한다
    why: 성별 축에 농가·비농가 같은 추가 구분이 들어 있는 표가 있다
    evidence: "101/DT_1DA7001S 성별 축: 계, 남자, 여자, 농가, 농가남자 …"
    verified: "2026-10-12"

  # ── 데이터 (d) ──
  - id: data.list-codes
    topic: data
    when: 같은 축에서 여러 값을 조회할 때
    do: "코드를 + 로 잇는다 (예 --class1 \"26010+26020\"). 개수 제한은 확인되지 않았다(84개까지 실측 성공 — 그 이상은 미확인). 축 전체면 ALL, + 나열이 실패하면 오류 코드를 보고 나눠 조회한다. 4만 셀 초과는 kosis 가 자동 분할"
    why: 한 번의 조회로 여러 값을 받는다. 예전 문서의 '10개 이상 금지' 는 근거가 없었다
    evidence: "2026-10-12 118/DT_118N_SAUPM75 지역 코드 32·60·84개(약 1,730자)를 + 로 조회 모두 성공. 이전: 산업 대분류 18개, 101/DT_1YL20162E 서울 25개 구 성공"
    verified: "2026-10-12"

  - id: data.pivot
    topic: data
    when: 지역·시점 등을 열로 놓은 비교표가 필요할 때
    do: "kosis d … --pivot C1 (분류1 값이 열), --pivot PRD (시점이 열), --pivot ITM (항목이 열 — 열 이름이 '항목명(단위)'). 분류 이름(시도별)도 된다. 결과를 파일로 남기려면 .csv·.xlsx·.json (parquet 은 안 됨)"
    why: "긴 표를 직접 피벗하지 않아도 된다. 한 칸에 값이 겹치면 경고하고 첫 값만 남긴다. 항목마다 단위가 다르면 단위를 열 이름에 붙여 한 행으로 만든다"
    evidence: "d 101 DT_1FS1101 --class1 \"26010+26020+26030+26040+26510\" --class2 \"B+C\" --item T04 -p Y -l 1 --pivot C1 → 산업별 행 × 구군 열. d 101 DT_1FS1101 -c1 26010+26020 -c2 C -i T02+T04 -p Y -l 1 --pivot ITM -f json → 2행, 열 '종사자수(명)'·'출하액(백만원)' (2026-10-12). --pivot C1 -o x.parquet → exit 1"
    verified: "2026-10-12"

  - id: data.parquet-api-keys
    topic: data
    when: d 결과를 .parquet 으로 저장할 때
    do: "열은 API 키(C1…C8_NM, ITM_ID, ITM_NM, UNIT_NM, PRD_SE, PRD_DE, DT, DT_RAW, LST_CHN_DE)로 고정된다 — 읽을 때 그 이름을 쓴다. DT 는 숫자라 X(비공개)·- 등은 null 이 된다 — 값 표식은 반드시 DT_RAW(원문)로 판단한다. --pivot 결과는 parquet 에 담지 못하니(exit 1) .csv·.xlsx·.json 을 쓴다"
    why: "parquet 스키마가 고정이다. 예전(v0.5.17 까지) d -o *.parquet 은 한국어 라벨 열이라 값이 모두 비어 저장됐고, 숫자가 아닌 DT 는 원문 없이 null 이 됐다"
    evidence: "v0.5.17 빌드로 만든 r.parquet 4행 C1_NM·ITM_NM·DT 모두 nil, 수정 빌드 -o p1.parquet(옵션 없음)·--api-keys 모두 '중구/종사자수/705'. d 101 DT_1FS1101 -c1 26020 -c2 B -i T04 -p Y -l 1 은 json DT 'X' — 수정 전 parquet DT null·원문 없음, 수정 후 DT null·DT_RAW 'X' (parquet-go 판독, 2026-10-12)"
    verified: "2026-10-12"

  - id: data.stable-keys
    topic: data
    when: 여러 표의 d 결과를 같은 코드로 처리할 때
    do: "d … -f json --api-keys 로 받는다. 열 이름이 표와 상관없이 C1·C1_NM … C8_NM, ITM_ID·ITM_NM, PRD_SE·PRD_DE, DT, UNIT_NM 이다"
    why: 기본 출력의 열 이름은 표마다 다른 한국어 축 이름(시도별, 지역별(시/군/구) 등)이다
    evidence: "d 118 DT_118N_SAUPM75 … --api-keys 와 d 101 DT_1FS1101 … --api-keys 가 같은 키 구조(C1·C1_NM·…·DT·UNIT_NM)"
