  - id: period.code-labels
    topic: period
    when: 수록주기를 읽고 넘길 때
    do: "메타는 주기를 한글(년·월·분기)로 보여주고, d 에는 -p Y·M·Q 로 넘기며, d 결과의 PRD_SE 는 A(연)·M·Q 로 나온다 — 같은 것이다"
