    why: "메타 JSON 을 직접 가공하지 않아도 되고, 어느 축(--class 몇 번, 메타 OBJ_ID_SN 기준)인지 함께 나온다. 코드 고르기는 분류·항목(ITM)만 1번 부른다. --find 등은 --type 없이 또는 --type ITM 과만 쓰고, 다른 --type 과 쓰면 오류(종료 코드 1). v0.5.22 까지는 --type ITM 과 함께 쓰면 조용히 무시돼 전체(1,097행)가 나왔다"
    evidence: "m 101 DT_1FS1101 --find 출하액 → --item T04, --find 울주 → --class1 26510 (울산광역시 > 울주군). 2026-10-12 --axis item → 7개, --axis class2 → 산업축(--class2), m 118 DT_118N_SAUPM75 --level 1 → 규모별 --class3"
