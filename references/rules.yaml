  - id: data.prefix-includes-parent
    topic: data
    when: 접두 코드("41*")를 쓸 때
    do: 상위 값 자신과 모든 하위 단계가 섞여 나온다는 것을 감안한다. 한 단계만 원하면 하위 코드를 + 로 나열한다
    why: 접두 일치라 경기도(41)·시(41110…)·구가 모두 포함된다
    evidence: "d 101 DT_1YL20651E --class1 '41*' → 경기도 + 시·구 32행"
    verified: "2026-10-12"

  - id: data.all-mixes-levels
    topic: data
    when: ALL 을 쓸 때
    do: "모든 단계(대·중·소분류)가 다 나온다는 것을 감안한다. 대분류만 원하면 최상위 코드를 + 로 나열한다. 최상위가 기준 이름(성별·연령별…)인 묶음 축이면 ALL 을 쓰지 않는다 (meta.mixed-axis)"
    why: ALL 은 축의 모든 값
    evidence: "101/INH_DT_1K52F01_26 산업 ALL → 1,620개 업종, 1,851행"
    verified: "2026-10-12"

  - id: data.auto-split
    topic: data
    when: 큰 조회
    do: 4만 셀을 넘으면 kosis 가 시점·분류로 자동 분할한다. 너무 느리면 분류·항목을 좁힌다
    why: KOSIS 한 번 조회 한도 4만 셀 ([31])
    evidence: "DT_1B04006 단일 연도 ~134만 셀 → 분류 2차 분할로 89,353행 (LEARNINGS.md)"
    verified: "2026-06-15"

  # ── 시점 ──
  - id: period.quarter-format
    topic: period
    when: 분기(Q) 기간을 지정할 때
    do: "분기 YYYYQQ (2025년 1분기 = 202501), 반기 YYYYHH (상반기 202401·하반기 202402). 반기 코드는 S(공식)·H 둘 다 되고 결과 PRD_SE 는 S. kosis 는 5자리(20251)를 넣어도 6자리로 바꿔 보낸다(자동 분할 포함)"
    why: "KOSIS 는 6자리만 받는다 — 5자리(20251)는 [30] 데이터 없음. v0.5.22 까지 문서(SKILL·03·d 도움말)가 20241 로 잘못 적었고, 자동 분할도 5자리로 보내 큰 분기·반기 조회가 [30] 이 될 수 있었다"
    evidence: "d 101 DT_1DA7104S -p Q -s 202501 -e 202502 성공 / d 101 INH_1J22003 -p Q -s 20251 → [30]. 2026-10-12 API 직접: 301/DT_200Y108 Q 202401 성공·20241 [30], 101/DT_1ES3A02S prdSe=S·H 모두 성공(결과 S), 202401 성공·20241 [30]"
    verified: "2026-10-12"

  - id: period.month-year-format
    topic: period
    when: 월·연 기간을 지정할 때
    do: "월 YYYYMM (202601), 연 YYYY"
    why: 출력 시점 표기와 같다
    evidence: "101/DT_1YL20162E 월 202601, 연 표들 2024"
    verified: "2026-10-12"

  - id: period.latest-unit
    topic: period
    when: --latest N 을 쓸 때
    do: N 은 표 주기 단위의 개수다 (월간 표에서 최근 1년 = --latest 12)
