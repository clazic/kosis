# kosis 규칙 (rules.yaml) — AI 에이전트용
#
# kosis 를 쓰는 AI(Claude, GPT 등)가 s(검색) → m(메타) → d(데이터) 로 일할 때 따르는 검증된 지식.
# 사람용 설명은 LEARNINGS.md, 명령 문법은 references/13-reference.md.
#
# ── 읽는 법 ──
# 1. 모든 조회(s·m·d·ex) 전에 이 파일, LEARNINGS.md(오답노트), 로컬 규칙 ~/.kosis/rules.d/*.yaml(있으면)을 참조한다.
#    예외 없음 — 익숙한 표·짧은 조회도 마찬가지. 로컬이 더 최신이다.
#    kosis rules list [찾을 말] 로 둘을 함께 볼 수 있다 (-f json 이면 본문까지).
# 2. tables 에 원하는 통계표가 있으면 검색·메타를 건너뛰고 바로 써도 된다 (verified 날짜가 오래됐으면 m 으로 재확인).
#    단 axes 가 표의 분류 축 전부가 아니면 m 으로 먼저 확인한다 (kosis d 도 빠진 --classN 을 조회 전에 알려 준다).
#
# ── 쓰는 법 (로컬 규칙) ──
# s·m·d 를 하며 새로 확인한 사실은 ~/.kosis/rules.d/ 에 규칙 하나당 파일 하나로 추가한다.
# - 파일 이름 YYYYMMDD-<8hex>.yaml (ASCII 만). 내용은 kind·title·verified·evidence + 아래 절의 항목 필드.
#   (table 은 id 대신 table: "ORG/TBL"). 쓴 뒤 kosis rules validate 로 형식 점검.
# - 실제로 실행해 확인한 것만 적는다. 추측은 적지 않는다 (불확실하면 confidence: guess 로 표시).
# - evidence 에 무엇을 실행해 무엇을 봤는지 한 줄로 적는다. verified 에 날짜.
# - 틀린 규칙을 발견하면 지우지 말고 status: wrong 과 이유를 적는다.
# - 여러 번 확인된 로컬 규칙은 저장소의 이 파일로 올린다 (PR → 릴리스 → 모든 사용자).
#
# ── 형식 ──
# rules:   일반 규칙. id, topic, when(언제), do(무엇을), why, evidence, verified, [confidence]
# tables:  통계표별 검증된 코드·함정. id(ORG/TBL), name, periods, axes, items, facts, verified
#          axes 의 flag 는 kosis d 플래그(--class1 …), codes 는 "이름: 코드"
#          axes 에는 표의 분류 축을 모두 적는다(codes 는 일부만 적어도 됨 — 나머지는 note 에 m 명령으로)

version: 1
updated: "2026-10-12"

rules:

  # ── 작업 순서 ──
  - id: workflow.meta-first
    topic: workflow
    when: 처음 쓰는 통계표를 조회하기 전
    do: kosis m <ORG> <TBL> 로 분류축 개수·코드·수록주기를 먼저 확인한다
    why: 표마다 분류축 개수와 코드 체계가 다르다. 메타 없이 조회하면 [20]/[21] 이 난다
    evidence: "DT_1B04006 에 -c1 ALL 만 넣어 [20] objL 누락 (LEARNINGS.md)"
    verified: "2026-06-15"

  - id: workflow.fill-all-axes
    topic: workflow
    when: kosis d 인자를 만들 때
    do: 메타의 분류축 수만큼 --class1 ~ --classN 을 모두 채운다 (필요 없는 축은 합계 코드)
    why: 축 하나라도 빠지면 [20] objL 누락
    evidence: "DT_1B04006 은 A(시군구)+YRE(연령) 2축 — -c2 추가로 해결 (LEARNINGS.md)"
    verified: "2026-06-15"

  - id: workflow.codes-not-names
    topic: workflow
    when: 분류·항목을 지정할 때
    do: "한글 이름이 아니라 메타의 코드(ITM_ID)를 넘긴다. 코드를 짐작해 만들지 말고 kosis m --find/--under/--level 결과에서 그대로 가져온다 (합계·전체 코드도 표마다 다르다)"
    why: 이름이나 짐작한 코드를 넘기면 [21] 잘못된 요청 변수
    evidence: "kosis --help 표준 워크플로우 2단계. 2026-10-12 118/DT_118N_SAUPM75 에서 '전체' 코드를 짐작(INDUSTRY11_00, 15118SIZES_07_00)해 [21] — m --find 전체 / --level 1 로 찾은 INDUSTRY_11S0, 15118SIZES_0700 으로 성공"
    verified: "2026-10-12"

  - id: workflow.check-help-before-absent
    topic: workflow
    when: "kosis 에 어떤 기능(거르기·코드 찾기·피벗 등)이 없다고 말하거나 직접 가공(Python 등)하기 전"
    do: "해당 명령의 --help 를 끝까지 읽는다. 있는 기능: s --org/--stat/--region/--items, m --find/--under/--level, d --pivot/--api-keys/--fields, ex(주석·링크)"
    why: 기능을 찾지 않고 '없다' 고 말하거나 직접 가공한 사례가 있었다
    evidence: "2026-10-12 실사용 감사 G11 — 필터/피벗/이름 선택을 조사하지 않고 Python 피벗·CLASSIFICATIONS 가공"
    verified: "2026-10-12"

  - id: workflow.read-whole-docs
    topic: workflow
    when: SKILL.md·rules·references 를 읽다가 출력이 잘렸을 때
    do: 나머지를 이어서 읽는다 (rules 는 kosis rules list -f json 이나 찾을 말로 나눠 읽기)
    why: 잘린 뒤쪽에 적용해야 할 규칙이 있을 수 있다
    evidence: "2026-10-12 실사용 감사 G4 — cat 출력이 잘렸는데 재독하지 않음"
    verified: "2026-10-12"

  - id: workflow.report-failures-now
    topic: workflow
    when: "kosis 오류, 빈 결과, 외부 페이지 열기 실패(타임아웃) 등 무엇이든 실패했을 때"
    do: 바로 사용자에게 무엇이 실패했고 그래서 무엇을 확인하지 못했는지 알린다
    why: 실패를 나중에 말하면 결과의 검증 범위를 잘못 이해하게 된다
    evidence: "2026-10-12 실사용 감사 A2·A3·G3 — 울산시 통계 페이지 타임아웃을 즉시 보고하지 않음"
    verified: "2026-10-12"

  - id: workflow.record-learning
    topic: workflow
    when: "작업 중 규칙에 없던 사실을 확인했거나, 기존 규칙이 틀린 것을 알았거나, 에러·빈 결과·이상한 동작의 원인을 찾았을 때 ('원인을 찾았다'고 말하는 순간 모두 해당)"
    do: "사용자에게 보고하기 전에 같은 작업 안에서 kosis rules add 로 기록한다(verified·evidence 필수). 틀린 규칙은 지우지 말고 status: wrong 과 이유를 적고 맞는 내용을 새로 add. 보고에 무엇을 어디에 기록했는지 적는다"
    why: 원인을 말로만 밝히고 기록하지 않으면 다른 AI·다음 작업이 같은 실수를 한다
    evidence: "2026-10-12 실사용 감사 G7·G8 — 새 사실과 틀린 규칙을 기록하지 않음. 2026-10-12 규칙이 'F=5년'으로 틀려 3년 주기 표를 '데이터 없음'으로 오판 — 원인을 찾은 뒤 meta.period-codes 정정"
    verified: "2026-10-12"

  - id: workflow.rules-lookup
    topic: workflow
    when: 조회 전에 rules.yaml·LEARNINGS.md 를 참조할 때 (모든 조회 전 필수)
    do: "처음 한 번은 두 파일을 읽고, 이후 조회마다 그 조회에 해당하는 항목만 다시 찾는다 — kosis rules list --id <ORG/TBL 또는 규칙 id>, --kind table, --topic period 처럼 선택자로. 본문 검색(rules list 울산)은 관련 없는 규칙도 많이 나오니 마지막에. 같은 대화에서 파일 전체를 매번 다시 읽지 않는다"
    why: 매 조회마다 전체를 읽으면 왕복·컨텍스트만 늘고 필요한 항목은 놓치기 쉽다. 사용자 지시(모든 조회 전 참조)는 '해당 항목 확인'으로 지킨다
    evidence: "2026-10-12 rules list 울산 → 미분양·출생·물가 규칙까지 본문 일치로 나옴. --id 101/DT_1FS1101 → 그 표 항목만"
    verified: "2026-10-12"

  - id: workflow.rules-source
    topic: workflow
    when: 어느 rules 파일이 적용되는지 확인할 때 (교정한 rules 가 실제로 읽히는지)
    do: "kosis rules list 출력 끝의 '배포:'·'로컬:' 경로를 본다. 배포 규칙은 KOSIS_RULES_FILE → ~/.claude → ~/.agents → ~/.hermes → ~/.config/opencode → ~/.gemini … 의 skills/kosis/references/rules.yaml 중 처음 있는 것, 로컬은 ~/.kosis/rules.d (더 최신)"
    why: 스킬이 여러 곳에 설치될 수 있다. kosis update 가 모든 위치를 같은 버전으로 맞춘다
    evidence: "2026-10-12 설치 6곳(.claude·.agents·.hermes·.config/opencode·.gemini·.antigravity) 모두 VERSION v0.5.17, SKILL.md·rules.yaml sha256 동일"
    verified: "2026-10-12"

  - id: workflow.small-first
    topic: workflow
    when: 본 조회 전
    do: --latest 1~5 로 값·시점 형식을 먼저 확인하고 범위를 넓힌다
    why: 틀린 코드·주기를 큰 조회 전에 잡는다
    evidence: "kosis --help 표준 워크플로우 3단계"
    verified: "2026-10-12"

  # ── 검색 (s) ──
  - id: search.terms-not-sentences
    topic: search
    when: kosis s 검색어를 정할 때
    do: 문장이 아니라 통계표 이름에 쓰일 짧은 용어로 검색한다. "~별" 단어(구군별·업종별)와 조사(와·과·및)는 뺀다
    why: KOSIS 검색은 표 이름 매칭이라 문장을 넣으면 결과가 없다([30])
    evidence: "s \"구군별 업종별 종사자수 와 생산액\" → [30]. \"종사자수 생산액\" 은 결과 있음"
    verified: "2026-10-12"

  - id: search.kosis-vocabulary
    topic: search
    when: 일상어로는 원하는 표가 안 나올 때
    do: "KOSIS 표 이름의 말로 바꿔 검색한다 — 구군·시군·구별 → 시군구, 업종 → 산업, 결혼 → 혼인, 태어난 아기 → 출생아수, 순유입 → 순이동, (물가) 상승률·증감률 → 등락률, 가계 소득·지출 → 가계수지, GRDP → 지역내총생산, 자가보유율·무주택 → 주택소유가구비율 T0021·무주택가구비율 T0031 (101/DT_1YL202111, 주택소유통계) — 주거실태조사 점유형태 '자가'(116/DT_MLTM_6909)는 자가점유율이라 다른 지표, (초·중·고) 학생수 → 초등학교·중학교·고등학교 개황 (또는 --stat 교육기본통계), 가계부채 → 가계신용(301), 외국인 → 외국인주민(110), (생산지수) 전년동월비 → 증감률, 기대수명 → 생명표, 자살률 → 사망원인·자살률 (「자살 시도」는 설문 표), 흡연율 → 현재흡연율 (「성인」을 넣으면 엉뚱한 표), 쌀 → 미곡 (「쌀」은 가공식품 표로 쏠림), 어가 수 → 해수면 어가·내수면 어가 (합계 표 없음), 농가·어가 총조사 해 값 → --stat 농림어업총조사, (주가) 월말 종가 → 연월말, 원/달러 환율 → IMF 국내 통화 환율(101/DT_2IFS011 — 한국은행 환율 표 DT_036Y… 는 2014 에서 끝), 국세 수입 → 국세청 세수·징수실적, 지방세 시도 합계 → 징수실적 총괄 (--org 110). 기관 이름이 질문에 있으면 --org (예 --org 국민연금)"
    why: 표 이름은 행정·통계 용어를 쓴다
    evidence: "\"종사자수 시군구 산업\" 으로 118/DT_118N_SAUPM75 등 시군구×산업 표가 검색됨. 출생아수·혼인·순이동은 s 결과 표 이름으로 확인. 2026-10-12 RSI: 's 소비자물가지수 전년동월비' 2건에 정답 표 빠짐, 정답 101/DT_1J22042 이름은 '…등락률'"
    verified: "2026-10-12"

  - id: search.survey-name
    topic: search
    when: 검색 결과가 0건이거나 엉뚱한 표만 나올 때
    do: 통계 조사명(예 "광업제조업조사", "사업체노동실태현황")으로 다시 검색한다
    why: 일상어와 KOSIS 항목명이 다르다
    evidence: "\"제조업 생산액\" 은 생산'지수'만 나옴 (LEARNINGS.md)"
    verified: "2026-06-21"

  - id: search.production-amount
    topic: search
    when: 시군구 단위 "생산액"이 필요할 때
    do: 광업제조업조사 표(101/DT_1FS1101)의 출하액(T04)을 쓴다. 이 조사는 광업·제조업만 다룬다
    why: 시군구 단위 생산액 통계는 광업제조업조사뿐이고, 항목 이름은 "출하액"이다
    evidence: "m 101 DT_1FS1101 항목: T01 사업체수 … T04 출하액 … T07 유형자산 (생산액 항목 없음)"
    verified: "2026-10-12"
    status: wrong
    wrong_reason: "출하액은 생산액과 다른 지표라 대용으로 쓰면 요청과 다른 답이 된다. '시군구 생산액은 광업제조업조사뿐' 도 검색해 본 범위에서만 맞는 말로 입증되지 않았다 (2026-10-12 실사용 감사)"
    replaced_by: [answer.requested-measure, search.absence-is-not-proof]

  - id: search.filters
    topic: search
    when: 검색 결과에 다른 지역·기관·분야 표가 많이 섞일 때
    do: "--org <기관 코드|이름 일부> 는 KOSIS 서버에서 거른다(이름은 기관별 목록에서 코드로 바꿈). --stat <조사명 일부>·--region <지역 이름> 은 받은 쪽 안에서만 거르므로 결과가 없거나 적으면 --page 2 … 로 다음 쪽도 본다. stderr '검색 범위'(전체 수·받은 수·거른 뒤 수)를 확인한다. 표마다 항목·단위를 보려면 --items (-n 을 작게)"
    why: "v0.5.22 까지 --org 도 받은 결과 안에서만 걸러 기관 표가 상위 결과 밖에 있으면 빈 결과였다(false negative). KOSIS 검색 API 는 orgId 를 받는다. --region 은 이름·기관·조사명·분류 경로 글자 매칭이라 전국 시도별 표는 빠진다"
    evidence: "s 출하액 --stat 광업제조업조사 → DT_1FS1103 등 광업제조업조사 표만. 2026-10-12 공식 API searchNm=생산액&orgId=207 → 울산광역시 표 30행(전체 607), 같은 날 v0.5.22 'kosis s 생산액 --org 울산' 은 빈 결과 → 고친 뒤 기관별 목록에서 울산광역시=207 로 바꿔 서버 필터"
    verified: "2026-10-12"

  - id: search.absence-is-not-proof
    topic: search
    when: 검색 결과에서 원하는 표를 못 찾았을 때
    do: "'KOSIS 에 없다' 고 말하지 말고 '이 검색어·필터·결과 수(-n) 범위에서 못 찾았다' 고 말한다. 다른 용어·조사명·--org/--stat 로 다시 찾고, 그래도 없으면 시도 단위처럼 다른 수준의 대안을 제시한다"
    why: 검색은 한 쪽(-n 개)만 받고 --stat/--region 은 그 안에서만 거른다. 결과에 없다고 통계가 없는 것은 아니다
    evidence: "2026-10-12 101/DT_1FS1104 는 시도 단위 생산액(T07) 표인데 '울산 생산액' 검색 상위 결과로는 구군까지 연결되지 않았다 (실사용 감사 C5·E3·E4)"
    verified: "2026-10-12"

  - id: search.population-differs
    topic: search
    when: 서로 다른 조사(STAT_NM)의 표를 함께 쓰거나 비교할 때
